name: Dual-partition host tests

on:
  push:
    paths:
      - "tools/**"
      - "buildtools/**"
      # The DBFW package contract is defined in the firmware too, and the host
      # tests assert the two definitions still agree -- so C-side edits must
      # trigger this workflow as well.
      - "src/fw_update/**"
      - "src/console/fw_command.c"
      - "src/hal_nvm/dspic33ak_nvm.h"
      - "firmware.X/nbproject/configurations.xml"
      - ".github/workflows/dual-partition-host-tests.yml"
  pull_request:
    paths:
      - "tools/**"
      - "buildtools/**"
      # The DBFW package contract is defined in the firmware too, and the host
      # tests assert the two definitions still agree -- so C-side edits must
      # trigger this workflow as well.
      - "src/fw_update/**"
      - "src/console/fw_command.c"
      - "src/hal_nvm/dspic33ak_nvm.h"
      - "firmware.X/nbproject/configurations.xml"
      - ".github/workflows/dual-partition-host-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run dual-partition HEX and package tests
        run: python tools/test_dual_partition_hex.py
